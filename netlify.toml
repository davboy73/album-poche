[[redirects]]
  from = "/g/:token"
  to = "/.netlify/functions/client/:token"
  status = 200

[[redirects]]
  from = "/m/:token"
  to = "/.netlify/functions/manifest/:token"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
